name: release

# Tag vX.Y.Z: compila Linux e Windows e publica a release com os pacotes.
# Manual (workflow_dispatch): só compila e guarda os pacotes como artefatos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 22.04: glibc mais antiga, o binário roda em mais distribuições.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsystemd-dev pkg-config ninja-build
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          strip build/gamecatcher
          ./build/gamecatcher --version
      - name: Empacotar
        run: |
          version=$(./build/gamecatcher --version | cut -d' ' -f2)
          name=gamecatcher-$version-linux-x86_64
          mkdir -p dist/$name/packaging
          cp build/gamecatcher README.md README.en.md dist/$name/
          cp -r packaging/linux dist/$name/packaging/
          tar -C dist -czf dist/$name.tar.gz $name
          # Binário solto para o atualizador (assinado no job release).
          cp build/gamecatcher dist/$name
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/gamecatcher-*-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências (vcpkg)
        run: vcpkg install curl:x64-windows-static nlohmann-json:x64-windows-static
      - name: Compilar
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release
          ./build/Release/gamecatcher.exe --version
      - name: Empacotar
        run: |
          $version = (./build/Release/gamecatcher.exe --version).Split(' ')[1]
          $name = "gamecatcher-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name/packaging" | Out-Null
          Copy-Item build/Release/gamecatcher.exe, README.md, README.en.md "dist/$name/"
          Copy-Item -Recurse packaging/windows "dist/$name/packaging/"
          # Dois cliques na raiz do pacote, sem PowerShell manual nem política de scripts.
          Copy-Item packaging/windows/install.bat, packaging/windows/uninstall.bat "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # Binário solto para o atualizador (assinado no job release).
          Copy-Item build/Release/gamecatcher.exe "dist/$name.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Assinatura Ed25519 de "<nome do arquivo>\n<binário>" (ver src/update.cpp). A chave privada
      # só existe no segredo; a pública está embutida no programa.
      - name: Assinar binários
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > key.pem
          pub=$(openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          embedded=$(grep -A3 'kPublicKey = {' src/update.cpp | grep -o '0x[0-9a-f]\{2\}' | sed 's/0x//' | tr -d '\n')
          [ "$pub" = "$embedded" ] || { echo "RELEASE_SIGNING_KEY não corresponde à chave em src/update.cpp" >&2; exit 1; }
          openssl pkey -in key.pem -pubout -out pub.pem
          for f in dist/gamecatcher-*-linux-x86_64 dist/gamecatcher-*-windows-x64.exe; do
            { printf '%s\n' "$(basename "$f")"; cat "$f"; } > msg.bin
            openssl pkeyutl -sign -rawin -inkey key.pem -in msg.bin -out "$f.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey pub.pem -in msg.bin -sigfile "$f.sig"
          done
          rm -f key.pem pub.pem msg.bin
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          notes=.github/release-notes/$tag.md
          gh release create "$tag" dist/* --title "${tag#v}" --notes-file "$notes" --verify-tag
